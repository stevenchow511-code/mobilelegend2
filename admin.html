<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - MLBB Arena</title>
  <style>
    body { background: #080d1a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    h2 { color: #00f5d4; text-align: center; font-size: 1.8rem; margin-bottom: 20px; }
    .card { background: #0e1626; padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { color: #38bdf8; margin-top: 0; border-bottom: 1px solid #1e293b; padding-bottom: 8px; font-size: 1.1rem; }
    .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 10px; }
    label { font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 3px; font-weight: 600; }
    input { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
    button { width: 100%; background: #00f5d4; color: #080d1a; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    button:hover { background: #00d2b5; }
    .team-row { background: #131c2e; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .team-title { font-weight: bold; color: #f59e0b; margin-bottom: 6px; font-size: 0.85rem; }
    
    /* Tab Styling */
    .tab-container { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 50%; }
    .tab-btn.active { background: #38bdf8; color: #080d1a; border-color: #38bdf8; }
  </style>
</head>
<body>

  <h2>🛠️ PANEL ADMIN MLBB ARENA</h2>

  <!-- 1. KLASEMEN GROUP A & B -->
  <div class="card">
    <h3>📊 UPDATE KLASEMEN GROUPS</h3>
    
    <div class="tab-container">
      <button class="tab-btn active" id="btnGroupA" onclick="switchGroup('A')">GROUP A</button>
      <button class="tab-btn" id="btnGroupB" onclick="switchGroup('B')">GROUP B</button>
    </div>

    <h4 id="groupTitle" style="color: #f59e0b; margin: 10px 0;">Mengedit: GROUP A</h4>

    <div id="formKlasemen">
      <!-- Generated by JavaScript -->
    </div>
    
    <button onclick="saveKlasemen()">SIMPAN KLASEMEN <span id="saveGroupText">GROUP A</span></button>
  </div>

  <!-- 2. TOP MVP (3 PLAYER) -->
  <div class="card">
    <h3>🏆 UPDATE TOP MVP (RANK 1-3)</h3>
    <div id="formMVP"></div>
    <button onclick="saveMVP()">SIMPAN TOP MVP</button>
  </div>

  <!-- 3. TOP SAVAGE (3 PLAYER) -->
  <div class="card">
    <h3>⚡ UPDATE TOP SAVAGE (RANK 1-3)</h3>
    <div id="formSavage"></div>
    <button onclick="saveSavage()">SIMPAN TOP SAVAGE</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDrjVWvZe30I0YnD6Nk_6hJd7qtAEK5l_8",
      authDomain: "mlbb---group-d.firebaseapp.com",
      projectId: "mlbb---group-d",
      storageBucket: "mlbb---group-d.firebasestorage.app",
      messagingSenderId: "550492341450",
      appId: "1:550492341450:web:ab7ecc97067a29fdab2033",
      measurementId: "G-SH722MK2FS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let activeGroup = 'A';

    // Render Forms
    function renderKlasemenForm() {
      let html = '';
      for(let i=1; i<=5; i++) {
        html += `
          <div class="team-row">
            <div class="team-title">POSISI #${i}</div>
            <div class="grid-inputs">
              <div><label>NAMA TIM</label><input type="text" id="t${i}_name" placeholder="Tim ${i}"></div>
              <div><label>MP</label><input type="number" id="t${i}_mp" placeholder="3"></div>
              <div><label>W</label><input type="number" id="t${i}_w" placeholder="2"></div>
              <div><label>L</label><input type="number" id="t${i}_l" placeholder="1"></div>
              <div><label>GAME W/L</label><input type="text" id="t${i}_gwl" placeholder="5 - 2"></div>
              <div><label>PTS</label><input type="number" id="t${i}_pts" placeholder="6"></div>
            </div>
          </div>`;
      }
      document.getElementById('formKlasemen').innerHTML = html;
    }

    function renderOtherForms() {
      let mvpHtml = '', svgHtml = '';
      for(let i=1; i<=3; i++) {
        mvpHtml += `
          <div class="team-row">
            <div class="team-title">MVP #${i}</div>
            <div class="grid-inputs" style="grid-template-columns: 2fr 2fr 1fr;">
              <div><label>NAMA PLAYER</label><input type="text" id="mvp${i}_name"></div>
              <div><label>TIM</label><input type="text" id="mvp${i}_team"></div>
              <div><label>TOTAL MVP</label><input type="number" id="mvp${i}_pts"></div>
            </div>
          </div>`;
        svgHtml += `
          <div class="team-row">
            <div class="team-title">SAVAGE #${i}</div>
            <div class="grid-inputs" style="grid-template-columns: 2fr 2fr 1fr;">
              <div><label>NAMA PLAYER</label><input type="text" id="svg${i}_name"></div>
              <div><label>TIM</label><input type="text" id="svg${i}_team"></div>
              <div><label>TOTAL SAVAGE</label><input type="number" id="svg${i}_pts"></div>
            </div>
          </div>`;
      }
      document.getElementById('formMVP').innerHTML = mvpHtml;
      document.getElementById('formSavage').innerHTML = svgHtml;
    }

    renderKlasemenForm();
    renderOtherForms();

    // Switch Group Handler
    window.switchGroup = function(group) {
      activeGroup = group;
      document.getElementById('groupTitle').innerText = `Mengedit: GROUP ${group}`;
      document.getElementById('saveGroupText').innerText = `GROUP ${group}`;
      
      document.getElementById('btnGroupA').classList.toggle('active', group === 'A');
      document.getElementById('btnGroupB').classList.toggle('active', group === 'B');
    }

    // Save Handlers
    window.saveKlasemen = function() {
      let data = {};
      for(let i=1; i<=5; i++) {
        data[`pos${i}`] = {
          name: document.getElementById(`t${i}_name`).value,
          mp: document.getElementById(`t${i}_mp`).value,
          w: document.getElementById(`t${i}_w`).value,
          l: document.getElementById(`t${i}_l`).value,
          gwl: document.getElementById(`t${i}_gwl`).value,
          pts: document.getElementById(`t${i}_pts`).value
        };
      }
      set(ref(db, `klasemen/group_${activeGroup.toLowerCase()}`), data)
        .then(() => alert(`Klasemen Group ${activeGroup} Berhasil Disimpan!`))
        .catch((e) => alert("Gagal Simpan: " + e.message));
    }

    window.saveMVP = function() {
      let data = {};
      for(let i=1; i<=3; i++) {
        data[`rank${i}`] = {
          name: document.getElementById(`mvp${i}_name`).value,
          team: document.getElementById(`mvp${i}_team`).value,
          pts: document.getElementById(`mvp${i}_pts`).value
        };
      }
      set(ref(db, 'top_mvp'), data)
        .then(() => alert("Top MVP Berhasil Disimpan!"))
        .catch((e) => alert("Gagal Simpan MVP: " + e.message));
    }

    window.saveSavage = function() {
      let data = {};
      for(let i=1; i<=3; i++) {
        data[`rank${i}`] = {
          name: document.getElementById(`svg${i}_name`).value,
          team: document.getElementById(`svg${i}_team`).value,
          pts: document.getElementById(`svg${i}_pts`).value
        };
      }
      set(ref(db, 'top_savage'), data)
        .then(() => alert("Top Savage Berhasil Disimpan!"))
        .catch((e) => alert("Gagal Simpan Savage: " + e.message));
    }
  </script>
</body>
</html>
